services:
  database:
    build:
      context: ./db
    image: powerlift-meet-management-database
    container_name: ${DB_CONTAINER_NAME:-pmm-database}
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: "Express"
    ports:
      - "${DB_PORT:-1433}:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools/bin/sqlcmd", "-U", "SA", "-P", "${DB_PASSWORD}", "-Q", "SELECT 1"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 60s
    networks:
      - pmm-network
    volumes:
      - db-data:/var/opt/mssql

  # .NET Backend API
  backend:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: ${BACKEND_CONTAINER_NAME:-pmm-backend}
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__Database=Server=database;Database=${DB_NAME:-PowerliftMeetManagement};User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;
    ports:
      - "${API_PORT:-5000}:80"
    depends_on:
      database:
        condition: service_healthy
    networks:
      - pmm-network
    restart: unless-stopped

  # Ionic/Angular Frontend
  frontend:
    build:
      context: ./powerlift-meet
      dockerfile: Dockerfile
    container_name: ${FRONTEND_CONTAINER_NAME:-pmm-frontend}
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    environment:
      - API_URL=http://backend:80
    depends_on:
      - backend
    networks:
      - pmm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  adminer:
    image: adminer:latest
    container_name: ${ADMINER_CONTAINER_NAME:-pmm-adminer}
    ports:
      - "${ADMINER_PORT:-8090}:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=database
      - ADMINER_DEFAULT_DB=${DB_NAME:-PowerliftMeetManagement}
      - ADMINER_DESIGN=pepa-linha
    depends_on:
      database:
        condition: service_healthy
    networks:
      - pmm-network
    restart: unless-stopped

volumes:
  db-data:
    name: pmm-database-volume

networks:
  pmm-network:
    driver: bridge
